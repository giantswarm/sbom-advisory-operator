# This file is a Helm values file for the sbom-advisory-operator chart.
#
# To learn more about how to configure your app on your cluster
# and override the default values in here, visit:
#
#   https://docs.giantswarm.io/tutorials/fleet-management/app-platform/app-configuration/#basic-values-merging-example
#

image:
  name: "giantswarm/sbom-advisory-operator"
  tag: ""
  pullPolicy: IfNotPresent
registry:
  domain: gsoci.azurecr.io

replicas: 1

ciliumNetworkPolicy:
  enabled: true

# Additional advisories, merged over the built-in set by advisory id. An entry with the id of a
# built-in advisory replaces it; `{id: <built-in id>, disabled: true}` removes it. See the README
# for the rule schema.
advisories: []

# How often the operator looks for the kubescape storage API while it is absent from the cluster.
kubescapeDiscoveryInterval: 60s

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 256Mi

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []

# ServiceMonitor that scrapes Kyverno policy-reporter for this operator's PolicyReport results.
policyReporterServiceMonitor:
  # -- Create the ServiceMonitor.
  enabled: true
  # -- Observability tenant the findings are written to (label observability.giantswarm.io/tenant).
  tenant: giantswarm_security_default
  # -- Namespace of the policy-reporter Service.
  namespace: kyverno
  # -- Labels selecting the policy-reporter Service.
  serviceSelector:  # @schema additionalProperties: true
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/name: policy-reporter
  # -- Named Service port that serves /metrics.
  port: http
  # -- (duration) Scrape interval.
  interval: 60s
  # -- (duration) Scrape timeout.
  scrapeTimeout: 45s

# ServiceMonitor for the operator's controller-runtime metrics.
serviceMonitor:
  # -- Create the ServiceMonitor.
  enabled: true
  # -- (duration) Scrape interval.
  interval: 60s
  # -- (duration) Scrape timeout.
  scrapeTimeout: 45s
